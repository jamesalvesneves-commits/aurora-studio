name: Windows build and smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cockpit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy development cockpit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item build/Release/AURORA.exe staging/AURORA.exe
          windeployqt --release --compiler-runtime --dir staging staging/AURORA.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          Copy-Item docs/VALIDACAO.md staging/VALIDACAO.md
          'Development cockpit only. No music engines, installer or signature. Not a final user release.' | Set-Content staging/DEVELOPMENT.txt
          Get-ChildItem staging -Recurse -File | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path staging).Path, $_.FullName)
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $relative
          } | Set-Content development-sha256.txt
          Move-Item development-sha256.txt staging/SHA256SUMS.txt
      - name: Retain development package
        uses: actions/upload-artifact@v4
        with:
          name: aurora-cockpit-development-windows-x64
          path: staging/
          if-no-files-found: error
          retention-days: 14
