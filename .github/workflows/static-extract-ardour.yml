name: Static extraction and PE inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download, verify, extract, and inspect without execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence, extracted | Out-Null
          $package = Join-Path $env:RUNNER_TEMP 'aurora-ardour-inspection.exe'
          $url = 'https://nightly.ardour.org/d/A_WIN_x86_64_FREE_DBG/Ardour-9.8.230-demo-dbg-w64-Setup.exe'
          $expected = '12331c428d78c06e02e0d08ab11526bc7c54777f2da1a5548974b4d210ac11e1'
          & curl.exe --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 240 --max-filesize 629145600 --output $package $url
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw 'SHA-256 mismatch; extraction blocked' }
          if ((Get-Item -LiteralPath $package).Length -ne 365484183) { throw 'Unexpected size; extraction blocked' }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (!(Test-Path -LiteralPath $sevenZip)) { throw '7-Zip unavailable' }
          & $sevenZip x -y -o"$PWD/extracted" -- $package | Out-File evidence/extraction-log.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          $report = [ordered]@{
            package_sha256 = $hash
            package_size_bytes = 365484183
            installer_executed = $false
            extraction_completed = $true
            files = @()
          }
          $targets = Get-ChildItem extracted -Recurse -File -Include *.exe,*.dll | Select-Object -First 200
          foreach ($file in $targets) {
            $versionInfo = $file.VersionInfo
            $report.files += [ordered]@{
              path = $file.FullName.Substring((Get-Item extracted).FullName.Length + 1)
              size_bytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              machine = if ($versionInfo.FileVersion) { $versionInfo.FileVersion } else { $null }
              product_name = $versionInfo.ProductName
              file_description = $versionInfo.FileDescription
              company_name = $versionInfo.CompanyName
            }
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content evidence/static-extraction-report.json -Encoding utf8
          $report.files | ConvertTo-Json -Depth 6 | Set-Content evidence/binary-metadata.json -Encoding utf8
          Remove-Item -LiteralPath $package -Force
          Remove-Item -Recurse -Force extracted
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-static-extraction
          path: evidence/
          if-no-files-found: error
          retention-days: 14
