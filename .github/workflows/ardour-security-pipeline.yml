name: Ardour nightly security inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ardour-security-pipeline.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-current-nightly:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current Windows x64 installer
        id: resolve
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $list = Invoke-WebRequest -Uri 'https://nightly.ardour.org/list.php' -UseBasicParsing
          $list.Content | Set-Content evidence/nightly-list.html -Encoding utf8
          $matches = [regex]::Matches($list.Content, 'href="([^"]*A_WIN_x86_64[^"]*\.exe)"')
          if ($matches.Count -eq 0) { throw 'No Windows x86_64 installer found' }
          $href = $matches[$matches.Count - 1].Groups[1].Value
          $base = [Uri]'https://nightly.ardour.org/'
          $url = [Uri]::new($base, $href).AbsoluteUri
          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          [ordered]@{resolved_url=$url; matches=$matches.Count} | ConvertTo-Json | Set-Content evidence/resolution.json -Encoding utf8
      - name: Download and record identity
        id: download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = '${{ steps.resolve.outputs.url }}'
          $package = Join-Path $env:RUNNER_TEMP 'ardour-current.exe'
          $out = & curl.exe --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 300 --output $package $url 2>&1
          $exit = $LASTEXITCODE
          $out | Set-Content evidence/download-output.txt -Encoding utf8
          if ($exit -ne 0) { throw "curl failed: $exit" }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $package).Length
          $signature = Get-AuthenticodeSignature -LiteralPath $package
          [ordered]@{
            url=$url
            sha256=$hash
            size_bytes=$size
            acquired_at_utc=(Get-Date).ToUniversalTime().ToString('o')
            authenticode_status=[string]$signature.Status
            signer_subject=if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
            installer_executed=$false
          } | ConvertTo-Json | Set-Content evidence/current-installer-identity.json -Encoding utf8
          "package=$package" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: List package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'ardour-current.exe'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          $listing = & $sevenZip l -slt -- $package 2>&1
          $exit = $LASTEXITCODE
          $listing | Set-Content evidence/archive-listing.txt -Encoding utf8
          [ordered]@{exit_code=$exit} | ConvertTo-Json | Set-Content evidence/listing.json -Encoding utf8
          if ($exit -ne 0) { throw "listing failed: $exit" }
      - name: Remove package
        if: always()
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'ardour-current.exe'
          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Force }
          [ordered]@{installer_executed=$false; extraction_performed=$false; package_removed=$true} | ConvertTo-Json | Set-Content evidence/cleanup.json -Encoding utf8
      - name: Commit evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence
          if ! git diff --cached --quiet; then
            git commit -m 'Record current Ardour nightly inspection evidence'
            git push
          fi
