name: Ardour security pipeline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ardour-security-pipeline.yml'
      - 'approval/static-extraction-approved.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  static-inspection:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect package without execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path evidence/diagnostics | Out-Null
          $package = Join-Path $env:RUNNER_TEMP 'ardour-package.exe'
          $url = 'https://nightly.ardour.org/d/A_WIN_x86_64_FREE_DBG/Ardour-9.8.230-demo-dbg-w64-Setup.exe'
          $expected = '12331c428d78c06e02e0d08ab11526bc7c54777f2da1a5548974b4d210ac11e1'
          $report = [ordered]@{stage='static-inspection'; status='started'; installer_executed=$false}
          try {
            $out = & curl.exe --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 240 --max-filesize 629145600 --output $package $url 2>&1
            $exit = $LASTEXITCODE
            $out | Set-Content evidence/diagnostics/curl-output.txt -Encoding utf8
            $report.curl_exit_code = $exit
            if ($exit -ne 0) { throw "curl failed with exit code $exit" }
            $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath $package).Length
            $report.package_sha256 = $hash
            $report.package_size_bytes = $size
            if ($hash -ne $expected) { throw 'SHA-256 mismatch' }
            if ($size -ne 365484183) { throw 'Unexpected package size' }
            $signature = Get-AuthenticodeSignature -LiteralPath $package
            $report.authenticode_status = [string]$signature.Status
            $report.signer_subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
            if (!(Test-Path -LiteralPath $sevenZip)) { throw '7-Zip unavailable' }
            $listing = & $sevenZip l -slt -- $package 2>&1
            $listingExit = $LASTEXITCODE
            $listing | Set-Content evidence/diagnostics/archive-listing.txt -Encoding utf8
            $report.listing_exit_code = $listingExit
            if ($listingExit -ne 0) { throw "7-Zip listing failed with exit code $listingExit" }
            $report.status = 'static_inspection_completed'
          } catch {
            $report.status = 'failed'
            $report.error = $_.Exception.Message
            $_ | Out-String | Set-Content evidence/diagnostics/error.txt -Encoding utf8
            throw
          } finally {
            $report | ConvertTo-Json -Depth 8 | Set-Content evidence/diagnostics/static-inspection-report.json -Encoding utf8
            if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Force -ErrorAction SilentlyContinue }
          }
      - name: Commit inspection evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Record Ardour static inspection evidence'
            git push
          fi
  static-extraction:
    needs: static-inspection
    if: hashFiles('approval/static-extraction-approved.txt') != ''
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicit static-extraction approval
        shell: bash
        run: |
          test -f approval/static-extraction-approved.txt
          grep -Fx 'APPROVED_FOR_STATIC_EXTRACTION_ONLY' approval/static-extraction-approved.txt
      - name: Extract for static inspection only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path evidence/diagnostics, extracted | Out-Null
          $package = Join-Path $env:RUNNER_TEMP 'ardour-package.exe'
          $url = 'https://nightly.ardour.org/d/A_WIN_x86_64_FREE_DBG/Ardour-9.8.230-demo-dbg-w64-Setup.exe'
          $expected = '12331c428d78c06e02e0d08ab11526bc7c54777f2da1a5548974b4d210ac11e1'
          $report = [ordered]@{stage='static-extraction'; status='started'; installer_executed=$false}
          try {
            $out = & curl.exe --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 240 --max-filesize 629145600 --output $package $url 2>&1
            $exit = $LASTEXITCODE
            $out | Set-Content evidence/diagnostics/curl-output.txt -Encoding utf8
            if ($exit -ne 0) { throw "curl failed with exit code $exit" }
            $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath $package).Length
            if ($hash -ne $expected -or $size -ne 365484183) { throw 'Package identity verification failed' }
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
            $extractDir = Join-Path $PWD 'extracted'
            $log = & $sevenZip x -y "-o$extractDir" -- $package 2>&1
            $exit = $LASTEXITCODE
            $log | Set-Content evidence/diagnostics/extraction-log.txt -Encoding utf8
            if ($exit -ne 0) { throw "7-Zip extraction failed with exit code $exit" }
            $files = @(Get-ChildItem -LiteralPath $extractDir -Recurse -File | Where-Object { $_.Extension -eq '.exe' -or $_.Extension -eq '.dll' } | Select-Object -First 200)
            $entries = foreach ($file in $files) {
              $relative = [IO.Path]::GetRelativePath($extractDir, $file.FullName)
              $vi = $file.VersionInfo
              [ordered]@{
                path = $relative
                size_bytes = $file.Length
                sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                file_version = $vi.FileVersion
                product_name = $vi.ProductName
                file_description = $vi.FileDescription
                company_name = $vi.CompanyName
              }
            }
            $report.binary_count_inspected = $files.Count
            $report.files = $entries
            $report.status = 'static_extraction_completed_not_execution_approved'
          } catch {
            $report.status = 'failed'
            $report.error = $_.Exception.Message
            $_ | Out-String | Set-Content evidence/diagnostics/error.txt -Encoding utf8
            throw
          } finally {
            $report | ConvertTo-Json -Depth 8 | Set-Content evidence/diagnostics/static-extraction-report.json -Encoding utf8
            if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath extracted) { Remove-Item -Recurse -Force extracted -ErrorAction SilentlyContinue }
          }
      - name: Commit extraction evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Record Ardour static extraction evidence'
            git push
          fi
